name: interactive_reading_app
description: "AI-assisted interactive EPUB reader for foreign literature"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  path: ^1.9.1
  epubx: ^4.0.0
  html: ^0.15.6
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
